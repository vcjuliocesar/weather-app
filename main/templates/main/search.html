{% extends 'main/base.html' %}

{% load static %}

{% block title %}Inicio{% endblock %}

{% block content %}
    <form class="card" autocomplete="off" id="search-form">
        {% csrf_token %}
        {{form.city.label_tag}} {{form.city}}
        {{form.country.label_tag}} {{form.country}}
        <button type="submit">Buscar</button>
    </form>

    <section class="grid" id="result" hidden>
        <div class="card">
            <h2 id="cityTitle"></h2>
            <p class="temp"><span id="temp"></span>°C</p>
            <p id="summary"></p>
            <small id="updated"></small>
        </div>
        <div class="card">
            <canvas id="forecastChart"></canvas>
        </div>
    </section>
    
    <div id="error" class="alert" hidden></div>
{% endblock %}
